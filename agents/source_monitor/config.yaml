# Source Monitor agent configuration
# Property-specific sources are in projects/<property>/sources.yaml
# This file contains agent-level settings that apply across all properties.

agent:
  name: source_monitor
  version: "0.1.0"
  log_level: INFO

# Fetch settings
fetch:
  timeout_seconds: 30
  max_retries: 2
  retry_delay_seconds: 5
  max_items_per_source: 50        # Don't fetch more than this from a single source
  # NOTE: concurrent_sources deferred — using sequential fetch for M1-M2

# Deduplication
dedup:
  history_file: "data/source_monitor/seen_items.json"
  history_max_age_days: 30

# Hard filters applied before scoring
# Items failing these filters are dropped completely — not scored, not in evidence.
filters:
  max_age_days: 7              # Items older than this are dropped (prevents stale RSS items from ranking high)

# Preliminary scoring weights (must sum to ~100 for max possible score)
scoring:
  weights:
    recency: 20                   # How fresh (0-20)
    source_weight: 20             # Source trustworthiness (0-20)
    keyword_match: 20             # Title/snippet keyword hits (0-20)
    language_fit: 10              # Language match (0-10)
    length_signal: 10             # Content substance proxy (0-10)
    category_bonus: 10            # Priority category bonus (0-10)

  recency:
    max_score_hours: 6            # Items < 6h old get full recency score
    zero_score_hours: 72          # Items > 72h old get 0 recency score

  # Keyword-match gate: if keyword_match < threshold, language_fit, length_signal
  # and category_bonus are zeroed out. Prevents off-topic items (e.g., LATAM puff
  # pieces with one AI mention) from ranking high on bonuses.
  # 1.0 = "any keyword hit passes". 5.0 = requires ~1 high-priority title hit
  # (or several snippet hits) to keep bonuses.
  keyword_gate_threshold: 5.0

  # Priority keywords per property — Manuel's curated set (2026-05-07)
