## MIRA Flow QA Definitions
## Safe, non-destructive flows for validating MIRA's testability.
## Do NOT add flows that submit forms, upload files, or call paid APIs
## unless explicitly marked safe_mock: true.

base_url: "http://localhost:3000"
locale: "es"

flows:

  mira_route_readiness:
    description: "Visit all main routes and check for errors. No form submission."
    safe: true
    routes:
      - path: "/{locale}"
        name: "Landing"
      - path: "/{locale}/onboarding"
        name: "Onboarding"
      - path: "/{locale}/scan"
        name: "Scan"
      - path: "/{locale}/catalog"
        name: "Catalog"
      - path: "/{locale}/tryon/adidas-trefoil-tee"
        name: "TryOn (Adidas Trefoil Tee)"
    checks:
      - no_console_errors
      - no_page_errors
      - no_failed_network_4xx_5xx
      - screenshot_each_route

  mira_selector_readiness:
    description: "Assert that stable QA selectors exist on each page."
    safe: true
    pages:
      onboarding:
        path: "/{locale}/onboarding"
        selectors:
          - data-testid=input-name
          - data-testid=input-email
          - data-testid=input-height-cm
          - data-testid=input-weight-kg
          - data-testid=chip-size-S
          - data-testid=chip-build-slim
          - data-testid=chip-gender-f
          - data-testid=btn-onboarding-next
      scan:
        path: "/{locale}/scan"
        selectors:
          - data-testid=upload-front
          - data-testid=upload-side
          - data-testid=upload-back
          - data-testid=input-upload-front
          - data-testid=input-upload-side
          - data-testid=input-upload-back
          - data-testid=btn-skip-photos
          - data-testid=btn-scan-next
      catalog:
        path: "/{locale}/catalog"
        selectors:
          - data-testid=catalog-grid
          - data-testid=product-card-adidas-trefoil-tee
          - data-testid=filter-brand-all
          - data-testid=filter-category-all
      tryon:
        path: "/{locale}/tryon/adidas-trefoil-tee"
        selectors:
          - data-testid=tryon-page
          - data-testid=tryon-product
          - data-testid=tryon-size-S
          - data-testid=btn-tryon-start
      result:
        path: "/{locale}/result/mock-test-id"
        skip: true
        skip_reason: "No safe mock generation ID exists yet"
        selectors:
          - data-testid=result-page
          - data-testid=result-status
          - data-testid=tryon-result-image
          - data-testid=btn-try-another
          - data-testid=btn-buy

  mira_onboarding_safe_dry_flow:
    description: "Navigate to onboarding, fill fields locally, do NOT submit to Supabase."
    safe: true
    safe_mock: false
    steps:
      - verb: goto
        path: "/{locale}/onboarding"
      - verb: assert_selector
        selector: "[data-testid=input-name]"
      - verb: fill
        selector: "[data-testid=input-name]"
        value: "QA Test User"
      - verb: fill
        selector: "[data-testid=input-email]"
        value: "qa@test.local"
      - verb: fill
        selector: "[data-testid=input-height-cm]"
        value: "175"
      - verb: fill
        selector: "[data-testid=input-weight-kg]"
        value: "70"
      - verb: click
        selector: "[data-testid=chip-size-M]"
      - verb: click
        selector: "[data-testid=chip-build-regular]"
      - verb: click
        selector: "[data-testid=chip-gender-skip]"
      - verb: assert_selector
        selector: "[data-testid=btn-onboarding-next]"
      - verb: note
        message: "Form filled locally. NOT submitting to Supabase — no safe mock exists."
      - verb: screenshot
        name: "onboarding_filled"

  mira_full_e2e_mock_flow:
    description: "Full E2E journey using QA mock mode. Requires NEXT_PUBLIC_MIRA_ENABLE_QA_MOCKS=true."
    safe: true
    safe_mock: true
    requires_mock_mode: true
    steps:
      # 1. Onboarding — fill form and submit (writes to Supabase which may fail, that's OK)
      - verb: goto
        path: "/{locale}/onboarding"
      - verb: fill
        selector: "[data-testid=input-name]"
        value: "QA Test User"
      - verb: fill
        selector: "[data-testid=input-email]"
        value: "qa-test+mira@example.com"
      - verb: fill
        selector: "[data-testid=input-height-cm]"
        value: "170"
      - verb: fill
        selector: "[data-testid=input-weight-kg]"
        value: "68"
      - verb: click
        selector: "[data-testid=chip-size-M]"
      - verb: click
        selector: "[data-testid=chip-build-regular]"
      - verb: click
        selector: "[data-testid=chip-gender-skip]"
      - verb: screenshot
        name: "e2e_01_onboarding_filled"
      # Submit onboarding — may or may not succeed depending on Supabase state
      - verb: click
        selector: "[data-testid=btn-onboarding-next]"
      # Wait a moment and check where we ended up
      - verb: wait_for_navigation
        timeout: 10000
      - verb: screenshot
        name: "e2e_02_after_onboarding_submit"
      # 2. If we're on scan, skip photos; if still on onboarding (Supabase error), inject localStorage and navigate
      - verb: note
        message: "Checking if onboarding submit succeeded or if we need localStorage fallback"
      # Try clicking skip-photos if visible; if not we'll handle via localStorage
      # We use set_local_storage to ensure the tryon page can load flow data via legacy path
      - verb: set_local_storage
        key: "mira_profile"
        value: '{"name":"QA Test User","email":"qa-test+mira@example.com","height":"170","weight":"68","size":"M","build":"regular","gender":"skip"}'
      - verb: set_local_storage
        key: "mira_photos"
        value: '{"front":"qa-mock/front-placeholder.jpg"}'
      # 3. Navigate to scan and skip photos
      - verb: goto
        path: "/{locale}/scan"
      - verb: click
        selector: "[data-testid=btn-skip-photos]"
      - verb: wait_for_navigation
        timeout: 10000
      - verb: screenshot
        name: "e2e_03_catalog"
      # 4. Assert catalog and click product
      - verb: assert_selector
        selector: "[data-testid=catalog-grid]"
      - verb: click
        selector: "[data-testid=product-card-adidas-trefoil-tee]"
      - verb: wait_for_navigation
        timeout: 10000
      - verb: screenshot
        name: "e2e_04_tryon_page"
      # 5. Assert tryon page and trigger mock generation
      - verb: assert_selector
        selector: "[data-testid=tryon-page]"
      - verb: click
        selector: "[data-testid=tryon-size-M]"
      # Wait for flow data to load (legacy localStorage path)
      - verb: assert_selector
        selector: "[data-testid=btn-tryon-start]:not([disabled])"
        timeout: 10000
      - verb: click
        selector: "[data-testid=btn-tryon-start]"
      # 6. Wait for navigation to result page (mock generation returns immediately)
      - verb: wait_for_navigation
        timeout: 15000
      - verb: screenshot
        name: "e2e_05_result_page"
      # 7. Assert result page elements
      - verb: assert_selector
        selector: "[data-testid=result-page]"
      - verb: assert_selector
        selector: "[data-testid=result-status]"
      # Mock returns completed status with image URL, wait for it to render
      - verb: assert_selector
        selector: "[data-testid=tryon-result-image]"
        timeout: 10000
      - verb: assert_selector
        selector: "[data-testid=btn-try-another]"
      - verb: screenshot
        name: "e2e_06_result_complete"
      - verb: note
        message: "Full E2E mock flow completed. No paid APIs called. No real customer data used."

  mira_full_flow_blocked:
    description: "Full REAL E2E flow — BLOCKED until RLS/auth/storage ready. Use mira_full_e2e_mock_flow for safe testing."
    status: BLOCKED
    blockers:
      - "Supabase Anonymous Sign-Ins may not be enabled"
      - "SUPABASE_SERVICE_ROLE_KEY not configured server-side"
      - "RLS not enabled on tables"
      - "Storage policies not configured"
      - "Real customer data safety decision pending"
      - "Use mira_full_e2e_mock_flow for safe mock-based validation"
    steps:
      - verb: blocked_reason
        message: "Cannot run real full flow until all blockers are resolved. Use mira_full_e2e_mock_flow instead."
